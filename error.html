<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>404 ♡</title>


  <!-- =========================
       FONTS
  ========================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Mali:wght@300;400;500;600&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {

      --bg: #FFF7F5;
      --dark: #252124;
      --pink: #D99AA5;
      --rose: #8F5F68;
      --text: #594348;
      --light: #FFFCFA;

    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    body {

      background: var(--bg);

      color: var(--text);

      font-family: "Mali", cursive;

      overflow: hidden;

    }


    /* =========================
       MAIN PAGE
    ========================= */

    .page {

      position: relative;

      width: 100%;

      height: 100dvh;

      min-height: 520px;

      overflow: hidden;

    }


    /* =========================
       ERROR SCREEN
    ========================= */

    .error-screen {

      position: absolute;

      inset: 0;

      z-index: 10;

      display: flex;

      justify-content: center;

      align-items: center;

      padding:
        30px
        24px
        calc(30px + env(safe-area-inset-bottom));

      background: var(--bg);

      text-align: center;

      transition:
        opacity 1s ease;

    }


    .error-content {

      width: min(
        100%,
        380px
      );

      animation:
        fadeIn 1s ease;

    }


    .error-code {

      font-family:
        "Quicksand",
        sans-serif;

      font-size: 18px;

      letter-spacing: 2px;

      color: #D66A76;

      margin-bottom: 15px;

    }


    .error-title {

      font-family:
        "Gowun Batang",
        serif;

      font-size:
        clamp(
          23px,
          7vw,
          29px
        );

      color: var(--rose);

      line-height: 1.5;

    }


    .error-text {

      margin-top: 17px;

      font-size:
        clamp(
          13px,
          4vw,
          15px
        );

      line-height: 2;

    }


    .loading {

      margin-top: 20px;

      font-size: 14px;

      color: var(--pink);

      animation:
        blink 1.3s infinite;

    }


    /* =========================
       FLASHLIGHT
    ========================= */

    .flashlight-text {

      display: none;

      position: absolute;

      left: 50%;

      top: 50%;

      transform:
        translate(-50%, -50%);

      width: 100%;

      padding: 20px;

      text-align: center;

      font-size: 16px;

      line-height: 2;

      z-index: 20;

    }


    .flashlight {

      position: absolute;

      left: 50%;

      top: 50%;

      width: 40px;

      height: 40px;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #FFFBEF 0%,
          #FFF2C8 25%,
          rgba(
            255,
            242,
            200,
            0.25
          ) 55%,
          transparent 72%
        );

      box-shadow:
        0 0 60px
        35px
        rgba(
          255,
          242,
          200,
          0.3
        );

      opacity: 0;

      z-index: 15;

      transition:
        width 1.5s ease,
        height 1.5s ease,
        opacity 1s ease;

    }


    .flashlight.show {

      opacity: 1;

      width: 280px;

      height: 280px;

    }


    /* =========================
       CAT SCENE
    ========================= */

    .cat-scene {

      position: absolute;

      inset: 0;

      display: none;

      background: #242022;

      z-index: 5;

    }


    .cat-scene.show {

      display: block;

      animation:
        sceneIn 1.2s ease;

    }


    /* =========================
       GLOW
    ========================= */

    .glow {

      position: absolute;

      width: 280px;

      height: 280px;

      left: 50%;

      top: 40%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(
            255,
            248,
            215,
            0.9
          ) 0%,
          rgba(
            255,
            248,
            215,
            0.35
          ) 35%,
          transparent 70%
        );

      opacity: 0;

      animation:
        lightOn 1.8s ease forwards;

    }


    /* =========================
       CAT
    ========================= */

    .cat {

      position: absolute;

      left: 50%;

      top: 38%;

      transform:
        translate(-50%, -50%)
        scale(0.7);

      width:
        clamp(
          125px,
          38vw,
          170px
        );

      opacity: 0;

      animation:
        catAppear 1.5s
        1.4s
        ease forwards;

      z-index: 4;

    }


    .cat img {

      width: 100%;

      height: auto;

      display: block;

      filter:
        drop-shadow(
          0 15px 18px
          rgba(
            0,
            0,
            0,
            0.18
          )
        );

    }


    /* =========================
       CAT TEXT
    ========================= */

    .cat-text {

      position: absolute;

      left: 50%;

      top: 59%;

      transform:
        translateX(-50%);

      width:
        min(
          88%,
          360px
        );

      text-align: center;

      color: #FFF8F5;

      font-size:
        clamp(
          13px,
          4vw,
          16px
        );

      line-height: 1.8;

      opacity: 0;

      animation:
        textAppear 1s
        3s
        ease forwards;

      z-index: 10;

    }


    .cat-text strong {

      font-family:
        "Gowun Batang",
        serif;

      font-size: 22px;

      font-weight: 400;

    }


    /* =========================
       DOOR
    ========================= */

    .door {

      position: absolute;

      right:
        clamp(
          20px,
          8vw,
          45px
        );

      bottom:
        clamp(
          105px,
          14vh,
          130px
        );

      width:
        clamp(
          62px,
          20vw,
          82px
        );

      height:
        clamp(
          84px,
          26vw,
          110px
        );

      border-radius:
        8px
        8px
        3px
        3px;

      background:
        linear-gradient(
          145deg,
          #FFF0F4,
          #D99AA5
        );

      border:
        3px solid
        rgba(
          255,
          235,
          240,
          0.9
        );

      box-shadow:
        0 0 30px
        rgba(
          255,
          192,
          210,
          0.5
        );

      opacity: 0;

      transform:
        translateX(50px);

      animation:
        doorAppear 1s
        4.8s
        ease forwards;

      z-index: 3;

    }


    .door::before {

      content: "";

      position: absolute;

      left: 50%;

      top: 0;

      width: 3px;

      height: 100%;

      background:
        rgba(
          143,
          95,
          104,
          0.15
        );

    }


    .door-knob {

      position: absolute;

      right: 12px;

      top: 55%;

      width: 7px;

      height: 7px;

      border-radius: 50%;

      background: var(--rose);

    }


    /* =========================
       FINAL MESSAGE
    ========================= */

    .door-text {

      position: absolute;

      left: 50%;

      bottom:
        calc(
          20px
          + env(safe-area-inset-bottom)
        );

      transform:
        translateX(-50%);

      width:
        min(
          92%,
          390px
        );

      padding:
        0
        10px;

      text-align: center;

      color: #FFF8F5;

      font-size:
        clamp(
          12px,
          3.6vw,
          15px
        );

      line-height: 1.7;

      opacity: 0;

      animation:
        finalText 1s
        6s
        ease forwards;

      z-index: 10;

    }


    /* =========================
       BUTTON
    ========================= */

    .next-button {

      display: block;

      margin:
        9px
        auto
        0;

      padding:
        10px
        23px;

      min-height: 42px;

      border:
        1px solid
        var(--pink);

      border-radius: 999px;

      background:
        rgba(
          255,
          252,
          250,
          0.96
        );

      color: var(--rose);

      font-family:
        "Mali",
        cursive;

      font-size: 13px;

      line-height: 1;

      cursor: pointer;

      white-space: nowrap;

      opacity: 0;

      animation:
        buttonAppear 1s
        6.5s
        ease forwards;

      box-shadow:
        0 5px 20px
        rgba(
          0,
          0,
          0,
          0.12
        );

    }


    .next-button:active {

      transform:
        scale(0.96);

    }


    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes fadeIn {

      from {

        opacity: 0;

        transform:
          translateY(12px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    @keyframes blink {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }

    }


    @keyframes sceneIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }


    @keyframes lightOn {

      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }

    }


    @keyframes catAppear {

      0% {

        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(0.65);

      }

      70% {

        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1.05);

      }

      100% {

        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1);

      }

    }


    @keyframes textAppear {

      from {

        opacity: 0;

        transform:
          translate(
            -50%,
            10px
          );

      }

      to {

        opacity: 1;

        transform:
          translate(
            -50%,
            0
          );

      }

    }


    @keyframes doorAppear {

      from {

        opacity: 0;

        transform:
          translateX(50px);

      }

      to {

        opacity: 1;

        transform:
          translateX(0);

      }

    }


    @keyframes finalText {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }


    @keyframes buttonAppear {

      from {

        opacity: 0;

        transform:
          translateY(10px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* =========================
       SHORT SCREEN
    ========================= */

    @media (max-height: 650px) {

      .cat {

        top: 34%;

        width: 125px;

      }


      .cat-text {

        top: 54%;

        line-height: 1.55;

      }


      .door {

        bottom: 105px;

        width: 60px;

        height: 82px;

      }


      .door-text {

        bottom:
          calc(
            12px
            + env(safe-area-inset-bottom)
          );

        font-size: 11px;

        line-height: 1.5;

      }


      .next-button {

        margin-top: 6px;

        min-height: 38px;

        padding:
          8px
          20px;

      }

    }


    /* =========================
       VERY SHORT SCREEN
    ========================= */

    @media (max-height: 560px) {

      .cat {

        top: 29%;

        width: 105px;

      }


      .cat-text {

        top: 48%;

        font-size: 11px;

      }


      .door {

        bottom: 90px;

      }


      .door-text {

        font-size: 10px;

        line-height: 1.4;

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <!-- =========================
         ERROR
    ========================= -->

    <section
      class="error-screen"
      id="errorScreen"
    >

      <div class="error-content">

        <div class="error-code">

          🔴 ERROR 404

        </div>


        <div class="error-title">

          ไม่พบสติของเจ้าของเว็บ

        </div>


        <div class="error-text">

          กรุณารอสักครู่…<br>

          กำลังหาไฟฉาย 🔦

        </div>


        <div class="loading">

          ……<br>
          ……

        </div>

      </div>

    </section>



    <!-- =========================
         FLASHLIGHT
    ========================= -->

    <div
      class="flashlight-text"
      id="flashlightText"
    >

      🔦 เจอไฟแล้วค่ะ

    </div>


    <div
      class="flashlight"
      id="flashlight"
    ></div>



    <!-- =========================
         CAT SCENE
    ========================= -->

    <section
      class="cat-scene"
      id="catScene"
    >


      <div class="glow"></div>


      <!-- CAT -->

      <div class="cat">

        <img
          src="IMG_0410.jpeg"
          alt="แมวอ้วน"
        >

      </div>


      <!-- CAT TEXT -->

      <div class="cat-text">

        🐱 เหมียว

        <br><br>

        ...

        <br><br>

        อ้าว

        <br>

        แมวก็ไม่รู้เหมือนกันค่ะ

      </div>



      <!-- =========================
           DOOR
      ========================= -->

      <div class="door">

        <div class="door-knob"></div>

      </div>



      <!-- =========================
           FINAL TEXT
      ========================= -->

      <div class="door-text">

        🐱 แต่ถ้าเป็นทางนี้...<br>

        น่าจะใช่นะ

        <br>

        <span>
          ก๊อก ก๊อก
        </span>

        <br>

        <span>
          พบทางไปต่อแล้ว ♡
        </span>


        <button
          class="next-button"
          onclick="nextPage()"
        >

          ตามแมวไป → ♡

        </button>

      </div>


    </section>


  </main>



  <script>


    /* =========================
       STORY TIMELINE
    ========================= */


    // 1. ERROR ค้างไว้ก่อน

    setTimeout(function() {

      document
        .getElementById(
          "errorScreen"
        )
        .style.opacity = "0";

    }, 3500);



    // 2. เปิดไฟฉาย

    setTimeout(function() {

      const error =
        document.getElementById(
          "errorScreen"
        );

      error.style.display = "none";


      document
        .getElementById(
          "flashlight"
        )
        .classList.add(
          "show"
        );


      document
        .getElementById(
          "flashlightText"
        )
        .style.display =
          "block";

    }, 4500);



    // 3. เจอแมว

    setTimeout(function() {

      document
        .getElementById(
          "flashlightText"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "catScene"
        )
        .classList.add(
          "show"
        );

    }, 6000);



    // 4. ไป birthday

    function nextPage() {

      window.location.href =
        "./birthday.html";

    }

  </script>


</body>

</html>
