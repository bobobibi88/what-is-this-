<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>404 ♡</title>


  <!-- =========================
       FONTS
  ========================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Mali:wght@300;400;500;600&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {

      --bg: #fff7f5;
      --dark: #211d1f;
      --pink: #d99aa5;
      --rose: #8f5f68;
      --cream: #fffdfb;
      --light: #fff8ef;

    }


    * {

      box-sizing: border-box;

      -webkit-tap-highlight-color:
        transparent;

    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

    }


    body {

      background: var(--bg);

      color: var(--rose);

      font-family: "Mali", cursive;

    }


    /* =========================
       PAGE
    ========================= */

    .page {

      position: relative;

      width: 100%;

      height: 100dvh;

      min-height: 100vh;

      overflow: hidden;

    }


    /* =========================
       ERROR
    ========================= */

    .error-screen {

      position: absolute;

      inset: 0;

      z-index: 50;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 25px;

      text-align: center;

      background: var(--bg);

      transition:
        opacity 1s ease;

    }


    .error-content {

      width: min(
        100%,
        350px
      );

      animation:
        fadeIn 1s ease;

    }


    .error-code {

      font-family:
        "Quicksand",
        sans-serif;

      font-size: 17px;

      letter-spacing: 2px;

      color: #d66a76;

      margin-bottom: 15px;

    }


    .error-title {

      font-family:
        "Gowun Batang",
        serif;

      font-size:
        clamp(
          23px,
          7vw,
          29px
        );

      line-height: 1.5;

    }


    .error-text {

      margin-top: 16px;

      font-size: 14px;

      line-height: 2;

    }


    .loading {

      margin-top: 20px;

      font-size: 14px;

      color: var(--pink);

      line-height: 1.8;

      animation:
        blink 1.2s infinite;

    }


    /* =========================
       DARK ROOM
    ========================= */

    .dark-room {

      position: absolute;

      inset: 0;

      z-index: 10;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 50%,
          #30292c,
          #171416 72%
        );

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 1s ease;

    }


    .dark-room.show {

      opacity: 1;

      pointer-events: auto;

    }


    /* =========================
       CAT
    ========================= */

    .cat {

      position: absolute;

      left: 50%;

      top: 38%;

      width: min(
        175px,
        48vw
      );

      transform:
        translate(
          -50%,
          20px
        )
        scale(.85);

      opacity: 0;

      transition:
        opacity 1s ease,
        transform 1s ease;

    }


    .cat.show {

      opacity: 1;

      transform:
        translate(
          -50%,
          0
        )
        scale(1);

    }


    .cat img {

      display: block;

      width: 100%;

      height: auto;

      filter:
        drop-shadow(
          0 15px 20px
          rgba(
            0,
            0,
            0,
            .35
          )
        );

    }


    /* =========================
       FLASHLIGHT
    ========================= */

    .flashlight {

      position: absolute;

      left: 50%;

      top: 42%;

      width: 110px;

      height: 110px;

      transform:
        translate(
          -50%,
          -50%
        );

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(
            255,
            250,
            220,
            .95
          ) 0%,
          rgba(
            255,
            242,
            190,
            .55
          ) 30%,
          rgba(
            255,
            240,
            190,
            .12
          ) 58%,
          transparent 72%
        );

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 1s ease;

    }


    .flashlight.show {

      opacity: 1;

      animation:
        flashlightFloat
        2.5s
        ease-in-out
        infinite;

    }


    @keyframes flashlightFloat {

      0%,
      100% {

        transform:
          translate(
            -50%,
            -50%
          );

      }

      50% {

        transform:
          translate(
            -50%,
            -53%
          );

      }

    }


    /* =========================
       CAT MESSAGE
    ========================= */

    .cat-message {

      position: absolute;

      left: 50%;

      bottom: 13%;

      width: min(
        90%,
        350px
      );

      transform:
        translateX(-50%)
        translateY(12px);

      text-align: center;

      color: #fff8f5;

      font-size: 15px;

      line-height: 2;

      opacity: 0;

      transition:
        opacity .8s ease,
        transform .8s ease;

    }


    .cat-message.show {

      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);

    }


    .cat-message .small {

      font-size: 13px;

      opacity: .7;

    }


    /* =========================
       DOOR AREA
    ========================= */

    .door-scene {

      position: absolute;

      inset: 0;

      z-index: 20;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding:
        25px
        20px
        35px;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 1s ease;

    }


    .door-scene.show {

      opacity: 1;

      pointer-events: auto;

    }


    /* =========================
       DOOR MESSAGE
    ========================= */

    .door-message {

      width: min(
        100%,
        340px
      );

      text-align: center;

      color: #fff8f5;

      margin-bottom: 22px;

      line-height: 1.9;

    }


    .door-message .title {

      font-family:
        "Gowun Batang",
        serif;

      font-size: 21px;

      margin-bottom: 4px;

    }


    .door-message .sub {

      font-size: 13px;

      opacity: .75;

    }


    .arrow {

      display: inline-block;

      margin-top: 5px;

      font-size: 23px;

      animation:
        arrowMove
        1s
        ease-in-out
        infinite;

    }


    @keyframes arrowMove {

      0%,
      100% {

        transform:
          translateX(-4px);

      }

      50% {

        transform:
          translateX(4px);

      }

    }


    /* =========================
       DOOR
    ========================= */

    .door-wrap {

      position: relative;

      width: 150px;

      height: 205px;

      perspective: 900px;

      cursor: pointer;

      touch-action: pan-y;

    }


    .door-frame {

      position: absolute;

      inset: 0;

      padding: 8px;

      border-radius:
        12px
        12px
        4px
        4px;

      background:
        linear-gradient(
          145deg,
          #eac1c8,
          #9f6973
        );

      box-shadow:
        0 0 35px
        rgba(
          235,
          160,
          184,
          .38
        );

    }


    .door-inside {

      position: absolute;

      inset: 8px;

      overflow: hidden;

      border-radius:
        7px
        7px
        2px
        2px;

      background:
        radial-gradient(
          circle at 50% 40%,
          #ffeaf1,
          #e4a8b5 55%,
          #8f5f68
        );

    }


    .door {

      position: absolute;

      inset: 0;

      z-index: 5;

      transform-origin:
        left center;

      background:
        linear-gradient(
          145deg,
          #fff0f3,
          #d99aa5
        );

      border:
        2px solid
        rgba(
          255,
          240,
          244,
          .9
        );

      border-radius:
        7px
        7px
        2px
        2px;

      transition:
        transform .8s ease;

      box-shadow:
        inset
        -7px 0
        15px
        rgba(
          143,
          95,
          104,
          .12
        );

    }


    .door.open {

      transform:
        rotateY(-72deg);

    }


    .door-knob {

      position: absolute;

      right: 17px;

      top: 52%;

      width: 10px;

      height: 10px;

      border-radius: 50%;

      background: #8f5f68;

      box-shadow:
        0 2px 4px
        rgba(
          0,
          0,
          0,
          .15
        );

    }


    .door-heart {

      position: absolute;

      left: 50%;

      top: 38%;

      transform:
        translate(-50%, -50%);

      color: #fff;

      font-size: 28px;

      opacity: .8;

    }


    /* =========================
       DRAG HINT
    ========================= */

    .drag-hint {

      margin-top: 19px;

      color: #fff8f5;

      font-size: 12px;

      opacity: .65;

      text-align: center;

    }


    .drag-icon {

      display: inline-block;

      margin-right: 5px;

      animation:
        dragMove
        1.3s
        ease-in-out
        infinite;

    }


    @keyframes dragMove {

      0%,
      100% {

        transform:
          translateX(-5px);

      }

      50% {

        transform:
          translateX(5px);

      }

    }


    /* =========================
       SUCCESS
    ========================= */

    .success {

      position: absolute;

      inset: 0;

      z-index: 40;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        radial-gradient(
          circle,
          #fffdfb,
          #f9e8eb
        );

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 1s ease;

    }


    .success.show {

      opacity: 1;

    }


    .success-text {

      text-align: center;

      color: var(--rose);

      font-family:
        "Gowun Batang",
        serif;

      font-size: 23px;

      line-height: 1.8;

      animation:
        fadeIn .8s ease;

    }


    .success-text span {

      font-family:
        "Mali",
        cursive;

      font-size: 13px;

    }


    /* =========================
       ANIMATION
    ========================= */

    @keyframes fadeIn {

      from {

        opacity: 0;

        transform:
          translateY(12px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    @keyframes blink {

      0%,
      100% {

        opacity: .35;

      }

      50% {

        opacity: 1;

      }

    }


    /* =========================
       SMALL SCREEN
    ========================= */

    @media (
      max-height: 680px
    ) {

      .cat {

        top: 34%;

        width: 145px;

      }


      .cat-message {

        bottom: 9%;

      }


      .door-message {

        margin-bottom: 13px;

      }


      .door-wrap {

        width: 125px;

        height: 175px;

      }


      .drag-hint {

        margin-top: 12px;

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <!-- =========================
         ERROR
    ========================= -->

    <section
      class="error-screen"
      id="errorScreen"
    >

      <div class="error-content">

        <div class="error-code">

          🔴 ERROR 404

        </div>


        <div class="error-title">

          ไม่พบสติของเจ้าของเว็บ

        </div>


        <div class="error-text">

          กรุณารอสักครู่…<br>

          กำลังหาไฟฉาย 🔦

        </div>


        <div class="loading">

          ……<br>

          ……

        </div>

      </div>

    </section>



    <!-- =========================
         DARK ROOM
    ========================= -->

    <section
      class="dark-room"
      id="darkRoom"
    >


      <div
        class="flashlight"
        id="flashlight"
      ></div>


      <div
        class="cat"
        id="cat"
      >

        <img
          src="IMG_0410.jpeg"
          alt="แมวอ้วนถือไฟฉาย"
        >

      </div>


      <div
        class="cat-message"
        id="catMessage"
      >

        🐱 เหมียว… เจอไฟแล้วค่ะ

        <br>

        <span class="small">

          แต่ทางไปต่ออยู่ไหนนะ...

        </span>

      </div>


      <!-- =========================
           DOOR
      ========================= -->

      <div
        class="door-scene"
        id="doorScene"
      >


        <div class="door-message">

          <div class="title">

            อ๊ะ เจอประตูแล้ว ♡

          </div>


          <div class="sub">

            รบกวนเลื่อนประตูให้ทีค่ะ

            <br>

            ตามลูกศร หรือคลิกที่ประตูก็ได้

          </div>


          <div class="arrow">

            ↓

          </div>

        </div>


        <div
          class="door-wrap"
          id="doorWrap"
        >

          <div class="door-frame">

            <div class="door-inside"></div>


            <div
              class="door"
              id="door"
            >

              <div class="door-heart">

                ♡

              </div>


              <div class="door-knob"></div>

            </div>

          </div>

        </div>


        <div class="drag-hint">

          <span class="drag-icon">

            ←

          </span>

          ลากประตูไปทางซ้าย

        </div>


      </div>


    </section>



    <!-- =========================
         SUCCESS
    ========================= -->

    <section
      class="success"
      id="success"
    >

      <div class="success-text">

        พบทางไปต่อแล้ว ♡

        <br>

        <span>

          กำลังเปิดประตู...

        </span>

      </div>

    </section>


  </main>



  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const errorScreen =
      document.getElementById(
        "errorScreen"
      );

    const darkRoom =
      document.getElementById(
        "darkRoom"
      );

    const flashlight =
      document.getElementById(
        "flashlight"
      );

    const cat =
      document.getElementById(
        "cat"
      );

    const catMessage =
      document.getElementById(
        "catMessage"
      );

    const doorScene =
      document.getElementById(
        "doorScene"
      );

    const door =
      document.getElementById(
        "door"
      );

    const doorWrap =
      document.getElementById(
        "doorWrap"
      );

    const success =
      document.getElementById(
        "success"
      );


    /* =========================
       STORY
    ========================= */

    setTimeout(function() {

      errorScreen.style.opacity = "0";

    }, 3500);


    setTimeout(function() {

      errorScreen.style.display =
        "none";

      darkRoom.classList.add(
        "show"
      );

    }, 4500);


    /* แมวออกมา */

    setTimeout(function() {

      flashlight.classList.add(
        "show"
      );

      cat.classList.add(
        "show"
      );

    }, 5000);


    /* แมวพูด */

    setTimeout(function() {

      catMessage.classList.add(
        "show"
      );

    }, 6500);


    /* ประตูมา */

    setTimeout(function() {

      doorScene.classList.add(
        "show"
      );

    }, 8000);



    /* =========================
       OPEN DOOR
    ========================= */

    let opened = false;


    function openDoor() {

      if (opened) return;

      opened = true;

      door.classList.add(
        "open"
      );


      setTimeout(function() {

        success.classList.add(
          "show"
        );

      }, 650);


      setTimeout(function() {

        window.location.href =
          "./birthday.html";

      }, 1800);

    }


    /* คลิกประตู */

    doorWrap.addEventListener(
      "click",
      function() {

        openDoor();

      }
    );



    /* =========================
       DRAG DOOR
    ========================= */

    let dragging = false;

    let startX = 0;


    doorWrap.addEventListener(
      "pointerdown",
      function(event) {

        if (opened) return;

        dragging = true;

        startX =
          event.clientX;

        doorWrap.setPointerCapture(
          event.pointerId
        );

      }
    );


    doorWrap.addEventListener(
      "pointermove",
      function(event) {

        if (
          !dragging ||
          opened
        ) return;


        const distance =
          startX -
          event.clientX;


        if (
          distance > 45
        ) {

          dragging = false;

          openDoor();

        }

      }
    );


    doorWrap.addEventListener(
      "pointerup",
      function() {

        dragging = false;

      }
    );


    doorWrap.addEventListener(
      "pointercancel",
      function() {

        dragging = false;

      }
    );

  </script>


</body>

</html>
