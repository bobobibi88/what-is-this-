<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ยังไม่กลับอีกเหรอ ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Mali:wght@300;400;500;600&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg: #FFF7F5;
      --card: #FFFCFA;
      --pink: #D99AA5;
      --rose: #8F5F68;
      --text: #594348;
      --blush: #F2D6D9;
      --gold: #D8B98A;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);

      font-family: 'Mali', cursive;

      overflow: hidden;
    }

    .page {
      position: relative;

      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;
    }

    .content {
      width: 100%;
      max-width: 520px;

      text-align: center;

      animation: fadeIn 1.3s ease;
    }

    .small-text {
      margin-bottom: 25px;

      font-family: 'Quicksand', sans-serif;

      font-size: 13px;
      letter-spacing: 3px;

      color: var(--pink);
    }

    .main-text {
      margin: 0;

      font-family: 'Gowun Batang', serif;

      font-size: clamp(25px, 7vw, 38px);

      font-weight: 400;

      line-height: 1.6;

      color: var(--rose);
    }

    .message {
      margin-top: 25px;

      font-size: 17px;

      line-height: 2;

      color: var(--text);
    }

    .button {
      margin-top: 35px;

      padding: 13px 32px;

      border: 1px solid var(--pink);

      border-radius: 999px;

      background: var(--card);

      color: var(--rose);

      font-family: 'Mali', cursive;

      font-size: 16px;

      cursor: pointer;

      transition: all 0.3s ease;
    }

    .button:hover {
      background: var(--pink);
      color: white;
      transform: translateY(-3px);
    }

    .deco {
      position: absolute;

      color: var(--pink);

      opacity: 0.45;

      pointer-events: none;

      animation: float 4s ease-in-out infinite;
    }

    .one {
      top: 18%;
      left: 15%;
    }

    .two {
      top: 30%;
      right: 15%;

      animation-delay: 1s;
    }

    .three {
      bottom: 20%;
      left: 20%;

      animation-delay: 2s;
    }

    .four {
      bottom: 28%;
      right: 18%;

      animation-delay: 0.5s;
    }

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <div class="deco one">♡</div>
    <div class="deco two">✦</div>
    <div class="deco three">˚₊‧</div>
    <div class="deco four">♡</div>


    <section class="content">

      <div class="small-text">
        WAIT A SECOND...
      </div>


      <h1 class="main-text">
        อ้าว...
      </h1>


      <div class="message">

        ยังไม่ออกไปอีกเหรอคะ?<br>

        ไหน ๆ ก็หลงเข้ามาแล้ว<br>

        อยู่ต่ออีกหน่อยมั้ย ♡

      </div>


      <button
        class="button"
        onclick="nextPage()"
      >
        ก็ได้ ♡
      </button>

    </section>

  </main>


  <script>

    function nextPage() {

      window.location.href = "password.html";

    }

  </script>


</body>
</html>
