<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>♡ The End ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Mali:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap');

:root {
    --background: #FFF7F5;
    --pink: #D99AA5;
    --rose: #8F5F68;
    --text: #594348;
    --card: #FFFCFA;
    --blush: #F2D6D9;
    --gold: #D8B98A;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #ffffff 0, transparent 25%),
        radial-gradient(circle at 80% 80%, #F2D6D9 0, transparent 28%),
        var(--background);

    color: var(--text);
    font-family: 'Mali', sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 430px;
    text-align: center;

    animation: fadeIn 2s ease;
}

.small {
    font-family: 'Gowun Batang', serif;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--rose);
    margin-bottom: 18px;
}

.heart {
    font-size: 30px;
    color: var(--pink);
    animation: heartbeat 2s infinite;
    margin-bottom: 8px;
}

.title {
    font-family: 'Gowun Batang', serif;
    font-size: 42px;
    letter-spacing: 5px;
    color: var(--rose);
    margin: 0;
}

.line {
    width: 80px;
    height: 1px;
    background: var(--gold);
    margin: 22px auto;
}

.message {
    font-size: 15px;
    line-height: 2;
    color: var(--text);
    margin: 0 auto;
}

.message strong {
    color: var(--rose);
    font-weight: 600;
}

.final {
    margin-top: 28px;
    font-family: 'Gowun Batang', serif;
    font-size: 15px;
    color: var(--rose);
}

.end {
    margin-top: 35px;
    font-family: 'Quicksand', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: #B58A91;
}

.star {
    position: absolute;
    color: #D8B98A;
    opacity: 0.45;
    animation: float 5s ease-in-out infinite;
}

.s1 {
    top: 15%;
    left: 12%;
}

.s2 {
    top: 25%;
    right: 13%;
    animation-delay: 1s;
}

.s3 {
    bottom: 18%;
    left: 18%;
    animation-delay: 2s;
}

.s4 {
    bottom: 12%;
    right: 15%;
    animation-delay: 3s;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}
</style>
</head>

<body>

<div class="star s1">✦</div>
<div class="star s2">⋆</div>
<div class="star s3">✧</div>
<div class="star s4">⋆</div>

<div class="container">

    <div class="small">a little message before you go</div>

    <div class="heart">♡</div>

    <h1 class="title">THE END</h1>

    <div class="line"></div>

    <p class="message">
        ขอบคุณนะคะ<br>
        ที่เข้ามาเป็นส่วนหนึ่งในชีวิตของกันและกัน<br><br>

        ขอให้ปีที่ <strong>21</strong> ของเธอ<br>
        เป็นปีที่มีแต่เรื่องดี ๆ เข้ามา<br>
        ขอให้ยิ้มได้เยอะ ๆ<br>
        และถ้าวันไหนเหนื่อยมาก ๆ<br>
        ก็อย่าลืมพักบ้างนะ :)
    </p>

    <div class="final">
        สุขสันต์วันเกิดนะอ้วน ♡
    </div>

    <div class="end">
        — END OF THIS LITTLE GIFT —
    </div>

</div>

</body>
</html>
