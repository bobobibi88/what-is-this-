<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Meow Security ♡</title>


  <!-- =========================
       FONTS
  ========================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Mali:wght@300;400;500;600&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {

      --bg: #FFF7F5;
      --pink: #D99AA5;
      --rose: #8F5F68;
      --text: #594348;
      --blush: #F2D6D9;
      --card: #FFFCFA;

    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

    }


    body {

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% 15%,
          #FFFDFB 0%,
          var(--bg) 60%,
          #F9EDEF 100%
        );

      color: var(--text);

      font-family: "Mali", cursive;

      overflow-x: hidden;

    }


    /* =========================
       MAIN PAGE
    ========================= */

    .page {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 35px 20px;

    }


    .content {

      width: 100%;

      max-width: 430px;

      text-align: center;

      animation: pageIn 1s ease;

    }


    /* =========================
       SMALL TITLE
    ========================= */

    .small-title {

      font-family: "Quicksand", sans-serif;

      font-size: 11px;

      letter-spacing: 3px;

      color: var(--pink);

      margin-bottom: 12px;

    }


    /* =========================
       TITLE
    ========================= */

    h1 {

      margin: 0;

      font-family: "Gowun Batang", serif;

      font-size: clamp(27px, 8vw, 38px);

      font-weight: 400;

      color: var(--rose);

      line-height: 1.5;

    }


    .description {

      margin-top: 12px;

      font-size: 15px;

      line-height: 1.9;

    }


    /* =========================
       OPENING CAT
    ========================= */

    .opening-cat {

      width: 190px;

      height: 190px;

      margin: 25px auto 0;

      display: flex;

      justify-content: center;

      align-items: center;

      animation:
        catArrive 1.2s ease forwards,
        catFloat 3s ease-in-out 1.2s infinite;

    }


    .opening-cat img {

      width: 100%;

      height: 100%;

      object-fit: contain;

      display: block;

      filter:
        drop-shadow(
          0 12px 15px
          rgba(143, 95, 104, 0.14)
        );

    }


    /* =========================
       MESSAGE
    ========================= */

    .message {

      margin-top: 12px;

      font-size: 15px;

      line-height: 2;

      animation: textIn 1s ease 0.6s both;

    }


    .message b {

      color: var(--rose);

      font-weight: 600;

    }


    /* =========================
       PAW / ARROW
    ========================= */

    .instruction {

      margin-top: 15px;

      color: var(--pink);

      font-size: 14px;

      line-height: 1.8;

      animation:
        bounce 1.8s ease-in-out infinite;

    }


    .arrow {

      display: block;

      margin-top: 3px;

      font-size: 23px;

    }


    /* =========================
       CAT TAP AREA
    ========================= */

    .cat-stage {

      margin: 15px auto 0;

      width: min(88vw, 330px);

      display: flex;

      justify-content: center;

      align-items: center;

    }


    .tap-cat {

      position: relative;

      width: 155px;

      height: 155px;

      padding: 0;

      border: 0;

      background: transparent;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        transform 0.2s ease;

    }


    .tap-cat img {

      width: 100%;

      height: 100%;

      object-fit: contain;

      display: block;

      filter:
        drop-shadow(
          0 10px 15px
          rgba(143, 95, 104, 0.13)
        );

      pointer-events: none;

    }


    .tap-cat:active {

      transform: scale(0.90);

    }


    .tap-label {

      position: absolute;

      left: 50%;

      bottom: -5px;

      transform:
        translateX(-50%);

      white-space: nowrap;

      padding: 5px 12px;

      border-radius: 999px;

      background: rgba(255,252,250,0.92);

      border:
        1px solid var(--blush);

      color: var(--rose);

      font-size: 11px;

      pointer-events: none;

    }


    /* =========================
       COUNTER
    ========================= */

    .counter {

      margin-top: 13px;

      font-family: "Quicksand", sans-serif;

      font-size: 12px;

      letter-spacing: 1px;

      color: var(--pink);

    }


    .paws {

      margin-top: 7px;

      display: flex;

      justify-content: center;

      gap: 7px;

    }


    .paw {

      width: 25px;

      height: 25px;

      display: flex;

      justify-content: center;

      align-items: center;

      border-radius: 50%;

      background: #FFF;

      border:
        1px solid var(--blush);

      font-size: 13px;

      opacity: 0.45;

      transition:
        all 0.3s ease;

    }


    .paw.done {

      opacity: 1;

      background: var(--blush);

      transform:
        translateY(-3px);

    }


    /* =========================
       RANDOM MESSAGE
    ========================= */

    .cat-message {

      min-height: 30px;

      margin-top: 14px;

      font-size: 14px;

      color: var(--rose);

      line-height: 1.8;

      animation: pop 0.35s ease;

    }


    /* =========================
       NEXT BUTTON
    ========================= */

    .next-button {

      display: none;

      margin: 22px auto 0;

      padding: 12px 28px;

      border: 1px solid var(--pink);

      border-radius: 999px;

      background: var(--rose);

      color: white;

      font-family: "Mali", cursive;

      font-size: 14px;

      cursor: pointer;

      box-shadow:
        0 8px 20px
        rgba(143,95,104,0.12);

      animation:
        pop 0.6s ease;

    }


    .next-button.show {

      display: block;

    }


    .next-button:active {

      transform: scale(0.96);

    }


    /* =========================
       DECORATION
    ========================= */

    .deco {

      position: fixed;

      color: var(--pink);

      opacity: 0.45;

      pointer-events: none;

      z-index: -1;

    }


    .deco.one {

      top: 15%;

      left: 12%;

      font-size: 20px;

      animation:
        float 4s ease-in-out infinite;

    }


    .deco.two {

      top: 25%;

      right: 13%;

      font-size: 14px;

      animation:
        float 5s ease-in-out 1s infinite;

    }


    .deco.three {

      bottom: 18%;

      left: 15%;

      font-size: 17px;

      animation:
        float 4.5s ease-in-out 0.5s infinite;

    }


    .deco.four {

      bottom: 25%;

      right: 15%;

      font-size: 20px;

      animation:
        float 5s ease-in-out 1.5s infinite;

    }


    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes pageIn {

      from {

        opacity: 0;

        transform:
          translateY(15px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    @keyframes catArrive {

      0% {

        opacity: 0;

        transform:
          translateY(80px)
          scale(0.75);

      }

      60% {

        opacity: 1;

        transform:
          translateY(-10px)
          scale(1.04);

      }

      100% {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    @keyframes catFloat {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(-7px);

      }

    }


    @keyframes textIn {

      from {

        opacity: 0;

        transform:
          translateY(10px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    @keyframes bounce {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(-5px);

      }

    }


    @keyframes float {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(-8px);

      }

    }


    @keyframes pop {

      from {

        opacity: 0;

        transform:
          scale(0.92);

      }

      to {

        opacity: 1;

        transform:
          scale(1);

      }

    }

  </style>

</head>


<body>


  <!-- DECORATIONS -->

  <div class="deco one">
    ♡
  </div>

  <div class="deco two">
    ✦
  </div>

  <div class="deco three">
    ˚₊‧
  </div>

  <div class="deco four">
    ♡
  </div>


  <!-- =========================
       MAIN
  ========================= -->

  <main class="page">

    <section class="content">


      <div class="small-title">

        MEOW SECURITY • 03

      </div>


      <h1>

        มีแขกมาขอพบค่ะ ♡

      </h1>


      <div class="description">

        กรุณารอสักครู่นะคะ...<br>

        น้องกำลังเดินทางมาถึงแล้ว

      </div>


      <!-- =========================
           OPENING CAT
      ========================= -->

      <div class="opening-cat">

        <img
          src="./IMG_0410.jpeg"
          alt="แมวอ้วนสามสี"
        >

      </div>


      <div class="message">

        <b>เหมียว~ Hello ♡</b><br>

        แมวผู้พิทักษ์มาถึงแล้วค่ะ

      </div>


      <!-- =========================
           INSTRUCTION
      ========================= -->

      <div class="instruction">

        ตรวจสอบเรียบร้อยแล้ว...<br>

        <b>ความอ้วมอยู่ในระดับน่ารักมาก</b><br>

        วันนี้อนุญาตให้เป็นเด็กอ้วนได้ 1 วัน

        <span class="arrow">

          ↓

        </span>

      </div>


      <!-- =========================
           TAP CAT
      ========================= -->

      <div class="cat-stage">


        <button
          class="tap-cat"
          id="tapCat"
          onclick="tapCat()"
        >

          <img
            id="catImage"
            src="./IMG_0405.jpeg"
            alt="แมว"
          >

          <span class="tap-label">

            TAP ME ♡

          </span>

        </button>


      </div>


      <!-- =========================
           COUNTER
      ========================= -->

      <div class="counter">

        เกาพุงน้องให้ครบ 5 ครั้งนะคะ ♡

      </div>


      <div class="paws">

        <span
          class="paw"
          id="paw1"
        >
          ♡
        </span>

        <span
          class="paw"
          id="paw2"
        >
          ♡
        </span>

        <span
          class="paw"
          id="paw3"
        >
          ♡
        </span>

        <span
          class="paw"
          id="paw4"
        >
          ♡
        </span>

        <span
          class="paw"
          id="paw5"
        >
          ♡
        </span>

      </div>


      <!-- =========================
           CAT MESSAGE
      ========================= -->

      <div
        class="cat-message"
        id="catMessage"
      >

        แตะพุงน้องเบา ๆ ได้เลย ♡

      </div>


      <!-- =========================
           NEXT
      ========================= -->

      <button
        class="next-button"
        id="nextButton"
        onclick="goNext()"
      >

        เหมียวอนุมัติแล้ว ♡

      </button>


    </section>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>


    let tapCount = 0;


    const cats = [

      "./IMG_0405.jpeg",

      "./IMG_0406.jpeg",

      "./IMG_0407.jpeg",

      "./IMG_0408.jpeg",

      "./IMG_0409.jpeg"

    ];


    const messages = [

      "แมวตรวจสอบแล้ว... ผ่านค่ะ ♡",

      "ความอ้วมอยู่ในระดับน่ารัก",

      "วันนี้อนุญาตให้เป็นเด็กอ้วนได้ 1 วัน",

      "พุงนุ่มมาก... ตรวจซ้ำอีกทีค่ะ ♡",

      "เหมียวอนุมัติให้เปิดต่อค่ะ!"

    ];


    function tapCat() {


      if (tapCount >= 5) {

        return;

      }


      tapCount++;


      /* เปลี่ยนรูปตามจำนวนครั้ง */

      document
        .getElementById("catImage")
        .src = cats[tapCount - 1];


      /* เติมหัวใจ */

      document
        .getElementById(
          "paw" + tapCount
        )
        .classList.add("done");


      /* เปลี่ยนข้อความ */

      const message =
        document.getElementById(
          "catMessage"
        );


      message.style.animation = "none";


      void message.offsetWidth;


      message.style.animation =
        "pop 0.35s ease";


      message.innerText =
        messages[tapCount - 1];


      /* ครบ 5 ครั้ง */

      if (tapCount === 5) {


        message.innerText =
          "เหมียวอนุมัติแล้วค่ะ ♡";


        document
          .getElementById(
            "nextButton"
          )
          .classList.add("show");


        document
          .querySelector(".counter")
          .innerText =
          "ตรวจสอบครบ 5 ครั้งแล้ว ♡";


      }

    }


    /* =========================
       NEXT PAGE
    ========================= */

    function goNext() {

      window.location.href =
        "./error.html";

    }


  </script>


</body>

</html>
