<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>♡</title>


  <!-- =========================
       FONTS
  ========================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Mali:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {

      --bg: #fff7f5;
      --pink: #d99aa5;
      --rose: #8f5f68;
      --dark: #443438;
      --cream: #fffdfb;
      --gold: #d9b875;
      --blush: #f2d6d9;

    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

    }


    body {

      min-height: 100vh;

      overflow: hidden;

      background: var(--bg);

      color: var(--dark);

      font-family: "Mali", cursive;

    }


    /* =========================
       MAIN
    ========================= */

    .page {

      position: relative;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .scene {

      position: relative;

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    /* =========================
       DARK INTRO
    ========================= */

    .dark-screen {

      position: absolute;

      inset: 0;

      z-index: 20;

      background: #181416;

      display: flex;

      align-items: center;

      justify-content: center;

      transition:
        opacity 1.5s ease,
        visibility 1.5s ease;

    }


    .dark-screen.hide {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    /* =========================
       PAW
    ========================= */

    .paw {

      position: absolute;

      left: 50%;
      top: 43%;

      transform:
        translate(-50%, -50%)
        rotate(-18deg)
        scale(0);

      font-size: 76px;

      opacity: 0;

      filter:
        drop-shadow(
          0 0 15px
          rgba(255,255,255,0.15)
        );

    }


    .paw.show {

      animation:
        pawAppear 1.8s ease forwards;

    }


    @keyframes pawAppear {

      0% {

        opacity: 0;

        transform:
          translate(-50%, -50%)
          rotate(-18deg)
          scale(0.3);

      }

      35% {

        opacity: 1;

        transform:
          translate(-50%, -58%)
          rotate(-8deg)
          scale(1);

      }

      55% {

        transform:
          translate(-50%, -45%)
          rotate(8deg)
          scale(1.05);

      }

      72% {

        transform:
          translate(-50%, -53%)
          rotate(-4deg)
          scale(0.96);

      }

      100% {

        opacity: 0;

        transform:
          translate(-50%, -70%)
          rotate(0deg)
          scale(0.85);

      }

    }


    /* =========================
       DUST
    ========================= */

    .dust {

      position: absolute;

      left: 50%;
      top: 43%;

      width: 200px;
      height: 100px;

      transform:
        translate(-50%, -50%);

      pointer-events: none;

    }


    .dust span {

      position: absolute;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #e9d9d5;

      opacity: 0;

    }


    .dust span:nth-child(1) {
      left: 20%;
      top: 45%;
    }

    .dust span:nth-child(2) {
      left: 35%;
      top: 30%;
    }

    .dust span:nth-child(3) {
      left: 55%;
      top: 55%;
    }

    .dust span:nth-child(4) {
      left: 70%;
      top: 35%;
    }

    .dust span:nth-child(5) {
      left: 80%;
      top: 60%;
    }


    .dust.show span {

      animation:
        dustFloat 1.4s ease forwards;

    }


    @keyframes dustFloat {

      0% {

        opacity: 0;

        transform: translateY(10px);

      }

      30% {

        opacity: 0.8;

      }

      100% {

        opacity: 0;

        transform: translateY(-35px);

      }

    }


    /* =========================
       READY TEXT
    ========================= */

    .ready-text {

      position: absolute;

      bottom: 27%;

      width: 100%;

      text-align: center;

      color: #f7e9e6;

      font-family: "Gowun Batang", serif;

      font-size: 18px;

      opacity: 0;

    }


    .ready-text.show {

      animation:
        textAppear 1s ease forwards;

    }


    @keyframes textAppear {

      from {

        opacity: 0;

        transform: translateY(8px);

      }

      to {

        opacity: 1;

        transform: translateY(0);

      }

    }


    /* =========================
       BIRTHDAY SCENE
    ========================= */

    .birthday-scene {

      position: absolute;

      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      background:

        radial-gradient(
          circle at 50% 38%,
          #fffdfb 0%,
          #fff7f5 48%,
          #f8e8eb 100%
        );

      opacity: 0;

      transition: opacity 1.5s ease;

    }


    .birthday-scene.show {

      opacity: 1;

    }


    /* =========================
       LIGHT
    ========================= */

    .light-glow {

      position: absolute;

      width: 390px;
      height: 390px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,245,206,0.9),
          rgba(255,245,206,0) 70%
        );

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 1.5s ease;

    }


    .light-glow.on {

      opacity: 1;

    }


    /* =========================
       BUBBLES
    ========================= */

    .bubble {

      position: absolute;

      padding: 10px 20px;

      border-radius: 999px;

      background:
        rgba(255,252,250,0.94);

      border:
        1px solid var(--blush);

      color: var(--rose);

      box-shadow:
        0 10px 30px
        rgba(143,95,104,0.12);

      font-family:
        "Quicksand",
        sans-serif;

      font-size: 13px;

      letter-spacing: 1px;

      opacity: 0;

    }


    .bubble.one {

      top: 15%;
      left: 50%;

      transform:
        translateX(-50%)
        translateY(12px)
        scale(.9);

    }


    .bubble.two {

      top: 23%;
      left: 50%;

      transform:
        translateX(-50%)
        translateY(12px)
        scale(.9);

    }


    .bubble.show {

      animation:
        bubbleIn .8s ease forwards;

    }


    @keyframes bubbleIn {

      to {

        opacity: 1;

        transform:
          translateX(-50%)
          translateY(0)
          scale(1);

      }

    }


    /* =========================
       CAKE AREA
    ========================= */

    .cake-area {

      position: relative;

      width: 290px;
      height: 310px;

      display: flex;

      align-items: center;

      justify-content: center;

      margin-top: 20px;

      opacity: 0;

      transform:
        translateY(25px)
        scale(.9);

      z-index: 3;

    }


    .cake-area.show {

      animation:
        cakeAppear 1.3s ease forwards;

    }


    @keyframes cakeAppear {

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* =========================
       PLATE
    ========================= */

    .plate {

      position: absolute;

      bottom: 18px;

      width: 245px;
      height: 30px;

      border-radius: 50%;

      background:
        linear-gradient(
          #fffaf9,
          #efdfe1
        );

      border:
        1px solid #ead2d5;

      box-shadow:
        0 12px 22px
        rgba(89,67,72,.14);

    }


    .plate::after {

      content: "";

      position: absolute;

      left: 18px;
      right: 18px;

      top: 7px;

      height: 10px;

      border-radius: 50%;

      border:
        1px solid
        rgba(217,154,165,.25);

    }


    /* =========================
       CAKE
    ========================= */

    .cake {

      position: absolute;

      bottom: 40px;

      width: 175px;
      height: 120px;

      border-radius:
        16px
        16px
        24px
        24px;

      background:
        linear-gradient(
          to bottom,
          #fffdfb,
          #f7dce0
        );

      border:
        1px solid #efd1d5;

      box-shadow:

        inset 0 -12px 0
        rgba(217,154,165,.15),

        0 17px 28px
        rgba(143,95,104,.16);

      z-index: 3;

    }


    /* cake layers */

    .cake::after {

      content: "";

      position: absolute;

      left: 10px;
      right: 10px;

      bottom: 25px;

      height: 2px;

      background:
        rgba(217,154,165,.25);

      box-shadow:
        0 -30px
        rgba(217,154,165,.16);

    }


    /* cake top */

    .cake-top {

      position: absolute;

      left: -5px;
      top: -20px;

      width: 185px;
      height: 42px;

      border-radius: 50%;

      background:
        linear-gradient(
          #fffdfb,
          #fff6f5
        );

      border:
        1px solid #efd9db;

      z-index: 4;

    }


    /* cream */

    .cream {

      position: absolute;

      left: 17px;
      top: -2px;

      width: 140px;
      height: 42px;

      border-radius: 50%;

      background: #fffdfb;

      z-index: 5;

    }


    /* cream drips */

    .cream::after {

      content: "";

      position: absolute;

      left: 10px;
      top: 25px;

      width: 12px;
      height: 18px;

      border-radius:
        0 0 10px 10px;

      background: #fffdfb;

      box-shadow:
        35px 4px 0 #fffdfb,
        75px -2px 0 #fffdfb,
        108px 5px 0 #fffdfb;

    }


    /* =========================
       DECORATIONS
    ========================= */

    .berry {

      position: absolute;

      width: 13px;
      height: 13px;

      border-radius: 50%;

      background: #d98b96;

      box-shadow:
        inset -2px -2px 0
        rgba(143,95,104,.15);

      z-index: 7;

    }


    .berry::before {

      content: "♡";

      position: absolute;

      top: -9px;
      left: 1px;

      font-size: 8px;

      color: #7f9c72;

    }


    .b1 {
      left: 32px;
      top: -10px;
    }

    .b2 {
      left: 75px;
      top: -16px;
      transform: scale(.8);
    }

    .b3 {
      right: 28px;
      top: -9px;
      transform: scale(.9);
    }


    /* =========================
       CANDLES
       ========================= */

    .candles {

      position: absolute;

      left: 50%;

      top: -66px;

      transform:
        translateX(-50%);

      display: flex;

      align-items: flex-end;

      justify-content: center;

      gap: 16px;

      z-index: 10;

    }


    .candle {

      position: relative;

      width: 10px;
      height: 48px;

      border-radius: 5px;

      background:
        repeating-linear-gradient(
          -45deg,
          #e8b4bd 0px,
          #e8b4bd 5px,
          #fff4f3 5px,
          #fff4f3 10px
        );

      box-shadow:
        0 2px 4px
        rgba(143,95,104,.12);

    }


    .candle:nth-child(2) {

      height: 55px;

    }


    .candle:nth-child(3) {

      height: 45px;

    }


    /* wick */

    .candle::before {

      content: "";

      position: absolute;

      left: 50%;
      top: -6px;

      width: 2px;
      height: 7px;

      transform:
        translateX(-50%);

      background: #594348;

      border-radius: 2px;

    }


    /* flame */

    .flame {

      position: absolute;

      left: 50%;
      top: -25px;

      width: 13px;
      height: 19px;

      transform:
        translateX(-50%);

      border-radius:
        50% 50% 50% 50%;

      background:
        radial-gradient(
          circle at 50% 65%,
          #fff8cf 0 30%,
          #f4bf69 45%,
          #e99474 70%
        );

      box-shadow:
        0 0 17px
        rgba(245,187,99,.7);

      animation:
        flame .8s
        ease-in-out
        infinite
        alternate;

    }


    @keyframes flame {

      from {

        transform:
          translateX(-50%)
          scale(.9)
          rotate(-2deg);

      }

      to {

        transform:
          translateX(-50%)
          scale(1.1)
          translateY(-2px)
          rotate(2deg);

      }

    }


    /* =========================
       SPARKLES
    ========================= */

    .sparkles {

      position: absolute;

      inset: 0;

      pointer-events: none;

      opacity: 0;

      z-index: 1;

    }


    .sparkles.show {

      opacity: 1;

    }


    .sparkle {

      position: absolute;

      color: var(--gold);

      animation:
        sparkle 2s
        ease-in-out
        infinite;

    }


    .s1 {
      top: 20%;
      left: 17%;
      font-size: 18px;
    }

    .s2 {
      top: 31%;
      right: 18%;
      font-size: 13px;
      animation-delay: .4s;
    }

    .s3 {
      top: 52%;
      left: 12%;
      font-size: 12px;
      animation-delay: .8s;
    }

    .s4 {
      top: 57%;
      right: 13%;
      font-size: 20px;
      animation-delay: 1.1s;
    }

    .s5 {
      top: 13%;
      right: 35%;
      font-size: 11px;
      animation-delay: .7s;
    }


    @keyframes sparkle {

      0%,
      100% {

        opacity: .3;

        transform:
          scale(.7)
          rotate(0deg);

      }

      50% {

        opacity: 1;

        transform:
          scale(1.25)
          rotate(20deg);

      }

    }


    /* =========================
       BIG BIRTHDAY POPUP
    ========================= */

    .birthday-popup {

      position: absolute;

      z-index: 30;

      left: 50%;
      top: 50%;

      width:
        min(
          88vw,
          390px
        );

      padding: 27px 23px 24px;

      transform:
        translate(-50%, -50%)
        scale(.7);

      opacity: 0;

      pointer-events: none;

      text-align: center;

      border-radius: 30px;

      background:
        rgba(255,253,251,.96);

      border:
        1px solid var(--blush);

      box-shadow:
        0 25px 80px
        rgba(89,67,72,.22);

    }


    .birthday-popup.show {

      animation:
        birthdayPopupIn
        1s
        cubic-bezier(.2,1.4,.4,1)
        forwards;

    }


    .popup-small {

      font-family:
        "Quicksand",
        sans-serif;

      font-size: 11px;

      letter-spacing: 3px;

      color: var(--pink);

    }


    .popup-main {

      margin-top: 10px;

      font-family:
        "Gowun Batang",
        serif;

      font-size:
        clamp(
          32px,
          9vw,
          48px
        );

      line-height: 1.1;

      color: var(--rose);

    }


    .popup-happy {

      margin-top: 9px;

      font-size: 20px;

      color: var(--dark);

    }


    .popup-age {

      margin-top: 8px;

      font-size: 14px;

      color: var(--rose);

    }


    .popup-deco {

      margin-top: 13px;

      font-size: 19px;

      letter-spacing: 5px;

      color: var(--gold);

    }


    @keyframes birthdayPopupIn {

      0% {

        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(.65)
          rotate(-3deg);

      }

      65% {

        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1.04)
          rotate(1deg);

      }

      100% {

        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1)
          rotate(0);

      }

    }


    /* =========================
       NEXT BUTTON
    ========================= */

    .next-button {

      position: absolute;

      bottom: 6%;

      z-index: 40;

      padding:
        11px 25px;

      border:
        1px solid var(--pink);

      border-radius: 999px;

      background:
        rgba(255,252,250,.94);

      color: var(--rose);

      font-family:
        "Mali",
        cursive;

      font-size: 13px;

      cursor: pointer;

      opacity: 0;

      transition:
        opacity .8s ease,
        transform .3s ease;

    }


    .next-button.show {

      opacity: 1;

    }


    .next-button:hover {

      transform:
        translateY(-3px);

      background:
        var(--blush);

    }


    /* =========================
       BLACKOUT
    ========================= */

    .blackout {

      position: absolute;

      inset: 0;

      z-index: 15;

      background: #181416;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .5s ease;

    }


    .blackout.on {

      opacity: 1;

    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-height: 700px) {

      .cake-area {

        transform:
          translateY(0)
          scale(.78);

      }

      .cake-area.show {

        animation:
          cakeSmall
          1.3s
          ease
          forwards;

      }

      @keyframes cakeSmall {

        to {

          opacity: 1;

          transform:
            translateY(0)
            scale(.78);

        }

      }

      .main-title {

        bottom: 13%;

      }

    }

  </style>

</head>


<body>


  <main class="page">

    <section class="scene">


      <!-- =========================
           DARK INTRO
      ========================= -->

      <div
        class="dark-screen"
        id="darkScreen"
      >

        <div
          class="paw"
          id="paw"
        >
          🐾
        </div>


        <div
          class="dust"
          id="dust"
        >

          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>

        </div>


        <div
          class="ready-text"
          id="readyText"
        >

          พร้อมอ้ะยางคับ... ♡

        </div>

      </div>



      <!-- =========================
           BIRTHDAY SCENE
      ========================= -->

      <div
        class="birthday-scene"
        id="birthdayScene"
      >


        <div
          class="light-glow"
          id="lightGlow"
        ></div>


        <!-- BUBBLES -->

        <div
          class="bubble one"
          id="bubbleOne"
        >

          26.09.69

        </div>


        <div
          class="bubble two"
          id="bubbleTwo"
        >

          your special day ♡

        </div>


        <!-- =========================
             CAKE
        ========================= -->

        <div
          class="cake-area"
          id="cakeArea"
        >


          <div class="plate"></div>


          <div class="cake">


            <div class="cake-top"></div>

            <div class="cream"></div>


            <!-- berries -->

            <div class="berry b1"></div>
            <div class="berry b2"></div>
            <div class="berry b3"></div>


            <!-- CANDLES -->

            <div class="candles">

              <div class="candle">

                <div class="flame"></div>

              </div>


              <div class="candle">

                <div class="flame"></div>

              </div>


              <div class="candle">

                <div class="flame"></div>

              </div>

            </div>


          </div>

        </div>


        <!-- =========================
             SPARKLES
        ========================= -->

        <div
          class="sparkles"
          id="sparkles"
        >

          <div class="sparkle s1">
            ✦
          </div>

          <div class="sparkle s2">
            ♡
          </div>

          <div class="sparkle s3">
            ✧
          </div>

          <div class="sparkle s4">
            ✦
          </div>

          <div class="sparkle s5">
            ˚₊‧
          </div>

        </div>


        <!-- =========================
             BIRTHDAY POPUP
        ========================= -->

        <div
          class="birthday-popup"
          id="birthdayPopup"
        >

          <div class="popup-small">

            A LITTLE MOMENT FOR YOU

          </div>


          <div class="popup-main">

            it’s your birthday!

          </div>


          <div class="popup-happy">

            Happy birthday อ้วมคุง ♡

          </div>


          <div class="popup-age">

            21 ขวบแล้วน้า

          </div>


          <div class="popup-deco">

            ✦ ♡ ✦

          </div>

        </div>


        <!-- =========================
             NEXT
        ========================= -->

        <button
          class="next-button"
          id="nextButton"
          onclick="nextPage()"
        >

          มีอะไรจะให้ด้วยนะ →

        </button>


        <!-- BLACKOUT -->

        <div
          class="blackout"
          id="blackout"
        ></div>


      </div>

    </section>

  </main>



  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const darkScreen =
      document.getElementById(
        "darkScreen"
      );

    const paw =
      document.getElementById(
        "paw"
      );

    const dust =
      document.getElementById(
        "dust"
      );

    const readyText =
      document.getElementById(
        "readyText"
      );

    const birthdayScene =
      document.getElementById(
        "birthdayScene"
      );

    const lightGlow =
      document.getElementById(
        "lightGlow"
      );

    const bubbleOne =
      document.getElementById(
        "bubbleOne"
      );

    const bubbleTwo =
      document.getElementById(
        "bubbleTwo"
      );

    const cakeArea =
      document.getElementById(
        "cakeArea"
      );

    const sparkles =
      document.getElementById(
        "sparkles"
      );

    const birthdayPopup =
      document.getElementById(
        "birthdayPopup"
      );

    const blackout =
      document.getElementById(
        "blackout"
      );

    const nextButton =
      document.getElementById(
        "nextButton"
      );


    /* =========================
       OPENING
    ========================= */

    window.addEventListener(
      "load",
      function() {


        /* แมว/อุ้งเท้า */

        setTimeout(function() {

          paw.classList.add(
            "show"
          );

          dust.classList.add(
            "show"
          );

        }, 700);


        /* ข้อความพร้อม */

        setTimeout(function() {

          readyText.classList.add(
            "show"
          );

        }, 1800);


        /* เปิดไฟ */

        setTimeout(function() {

          darkScreen.classList.add(
            "hide"
          );

          birthdayScene.classList.add(
            "show"
          );

        }, 3500);


        /* เค้กโผล่ */

        setTimeout(function() {

          lightGlow.classList.add(
            "on"
          );

          cakeArea.classList.add(
            "show"
          );

        }, 4100);


        /* วันที่ */

        setTimeout(function() {

          bubbleOne.classList.add(
            "show"
          );

        }, 4700);


        /* your special day */

        setTimeout(function() {

          bubbleTwo.classList.add(
            "show"
          );

        }, 5400);


        /*
          ไฟดับ
        */

        setTimeout(function() {

          blackout.classList.add(
            "on"
          );

          lightGlow.classList.remove(
            "on"
          );

        }, 7000);


        /*
          รอความมืด
          แล้วเปิดไฟกลับมา
        */

        setTimeout(function() {

          blackout.classList.remove(
            "on"
          );

          lightGlow.classList.add(
            "on"
          );

          bubbleOne.classList.remove(
            "show"
          );

          bubbleTwo.classList.remove(
            "show"
          );

          sparkles.classList.add(
            "show"
          );

        }, 8500);


        /*
          ✨ หลังไฟกลับมา
          POPUP วันเกิดค่อยเด้ง
        */

        setTimeout(function() {

          birthdayPopup.classList.add(
            "show"
          );

        }, 9200);


        /*
          ปุ่มไปต่อ
        */

        setTimeout(function() {

          nextButton.classList.add(
            "show"
          );

        }, 10800);


      }
    );


    /* =========================
       NEXT PAGE
    ========================= */

    function nextPage() {

      window.location.href =
        "./letter.html";

    }

  </script>
