<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>♡</title>


  <!-- =========================
       FONTS
  ========================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Mali:wght@300;400;500;600&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {

      --background: #FFF7F5;

      --pink: #D99AA5;

      --rose: #8F5F68;

      --text: #594348;

      --card: #FFFCFA;

      --blush: #F2D6D9;

      --gold: #D8B98A;

    }


    * {

      box-sizing: border-box;

    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      min-height: 100%;

    }


    body {

      min-height: 100vh;

      background: var(--background);

      color: var(--text);

      font-family: "Mali", cursive;

      overflow-x: hidden;

    }


    /* =========================
       FIREWORKS
    ========================= */

    .fireworks {

      position: fixed;

      inset: 0;

      pointer-events: none;

      overflow: hidden;

      z-index: 0;

    }


    .firework {

      position: absolute;

      left: 50%;

      bottom: -40px;

      width: 6px;

      height: 6px;

      font-size: 18px;

      opacity: 0;

      animation:
        fireworkLaunch 1.2s ease-out forwards;

    }


    .firework span {

      position: absolute;

      display: block;

      white-space: nowrap;

      transform: translate(-50%, -50%);

    }


    @keyframes fireworkLaunch {

      0% {

        opacity: 0;

        transform:
          translate(
            var(--x),
            0
          )
          scale(0.4);

      }


      15% {

        opacity: 1;

      }


      65% {

        opacity: 1;

        transform:
          translate(
            var(--x),
            var(--y)
          )
          scale(1);

      }


      100% {

        opacity: 0;

        transform:
          translate(
            var(--x),
            var(--y)
          )
          scale(1.35);

      }

    }


    /* =========================
       MAIN
    ========================= */

    .page {

      position: relative;

      z-index: 2;

      width: 100%;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 55px 22px;

    }


    .content {

      width: 100%;

      max-width: 480px;

      text-align: center;

      animation:
        pageIn 1.2s ease;

    }


    /* =========================
       TOP TEXT
    ========================= */

    .top-text {

      margin-bottom: 15px;

      font-family:
        "Quicksand",
        sans-serif;

      font-size: 12px;

      letter-spacing: 3px;

      color: var(--pink);

    }


    /* =========================
       MAIN TITLE
    ========================= */

    .intro {

      margin: 0;

      font-family:
        "Gowun Batang",
        serif;

      font-size:
        clamp(
          28px,
          8vw,
          42px
        );

      font-weight: 400;

      color: var(--rose);

      line-height: 1.4;

    }


    /* =========================
       HAPPY BIRTHDAY
    ========================= */

    .birthday {

      margin-top: 24px;

      color: var(--rose);

      font-family:
        "Quicksand",
        sans-serif;

      font-weight: 600;

      line-height: 1;

    }


    .birthday-line {

      display: block;

      font-size:
        clamp(
          43px,
          13vw,
          65px
        );

      letter-spacing: -1px;

    }


    .birthday-line:nth-child(2) {

      margin-top: 4px;

    }


    .birthday-line:nth-child(3) {

      margin-top: 8px;

      font-size:
        clamp(
          32px,
          10vw,
          48px
        );

    }


    /* =========================
       AGE
    ========================= */

    .age {

      margin-top: 27px;

      font-size: 16px;

      color: var(--text);

      line-height: 1.8;

    }


    .age-number {

      display: inline-block;

      margin: 0 5px;

      font-family:
        "Gowun Batang",
        serif;

      font-size: 32px;

      color: var(--pink);

    }


    /* =========================
       GIF CARD
    ========================= */

    .gif-card {

      width:
        min(
          78vw,
          300px
        );

      margin: 30px auto 0;

      padding: 9px;

      background: var(--card);

      border:
        1px solid
        var(--blush);

      border-radius: 25px;

      box-shadow:
        0 12px 35px
        rgba(
          143,
          95,
          104,
          0.10
        );

      animation:
        gifIn 1.5s ease;

    }


    .gif-card img {

      display: block;

      width: 100%;

      height: auto;

      border-radius: 18px;

    }


    /* =========================
       NEXT BUTTON
    ========================= */

    .next-button {

      display: block;

      margin: 28px auto 0;

      padding: 13px 27px;

      border:
        1px solid
        var(--pink);

      border-radius: 999px;

      background: transparent;

      color: var(--rose);

      font-family:
        "Mali",
        cursive;

      font-size: 15px;

      cursor: pointer;

      transition:
        background 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;

    }


    .next-button:hover {

      background: var(--blush);

      transform:
        translateY(-2px);

      box-shadow:
        0 7px 20px
        rgba(
          143,
          95,
          104,
          0.10
        );

    }


    .next-button:active {

      transform:
        scale(0.96);

    }


    /* =========================
       BOTTOM TEXT
    ========================= */

    .bottom-text {

      margin-top: 17px;

      font-size: 12px;

      color: var(--pink);

      opacity: 0.8;

    }


    /* =========================
       DECORATION
    ========================= */

    .decoration {

      position: fixed;

      pointer-events: none;

      color: var(--pink);

      opacity: 0.45;

      z-index: 1;

    }


    .deco-1 {

      top: 12%;

      left: 9%;

      font-size: 20px;

      animation:
        float 4s ease-in-out infinite;

    }


    .deco-2 {

      top: 22%;

      right: 10%;

      font-size: 13px;

      animation:
        float 5s ease-in-out infinite 1s;

    }


    .deco-3 {

      bottom: 15%;

      left: 12%;

      font-size: 16px;

      animation:
        float 4.5s ease-in-out infinite 0.5s;

    }


    .deco-4 {

      bottom: 20%;

      right: 12%;

      font-size: 20px;

      animation:
        float 5s ease-in-out infinite 1.5s;

    }


    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes pageIn {

      from {

        opacity: 0;

        transform:
          translateY(18px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    @keyframes gifIn {

      from {

        opacity: 0;

        transform:
          scale(0.93);

      }

      to {

        opacity: 1;

        transform:
          scale(1);

      }

    }


    @keyframes float {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(-8px);

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       FIREWORKS
  ========================= -->

  <div
    class="fireworks"
    id="fireworks"
  ></div>


  <!-- =========================
       DECORATIONS
  ========================= -->

  <div class="decoration deco-1">
    ♡
  </div>

  <div class="decoration deco-2">
    ✦
  </div>

  <div class="decoration deco-3">
    ˚₊‧
  </div>

  <div class="decoration deco-4">
    ♡
  </div>


  <!-- =========================
       MAIN PAGE
  ========================= -->

  <main class="page">

    <section class="content">


      <!-- TOP -->

      <div class="top-text">

        TODAY IS YOUR SPECIAL DAY ♡

      </div>


      <!-- TITLE -->

      <h1 class="intro">

        เฮ้ย วันเกิดนิ่!

      </h1>


      <!-- HAPPY BIRTHDAY -->

      <div class="birthday">


        <span class="birthday-line">

          Happy

        </span>


        <span class="birthday-line">

          Birthday

        </span>


        <span class="birthday-line">

          To you ♡

        </span>


      </div>


      <!-- AGE -->

      <div class="age">

        Already

        <span class="age-number">

          21

        </span>

        ขวบแล้วนะ

      </div>


      <!-- GIF -->

      <div class="gif-card">

        <img
          src="https://media1.tenor.com/m/8Yxax1WAq8oAAAAd/happy-birthday.gif"
          alt="Happy Birthday"
        >

      </div>


      <!-- NEXT -->

      <button
        class="next-button"
        onclick="goToLetter()"
      >

        มีจดหมายถึงเธอด้วยนะ ♡

      </button>


      <div class="bottom-text">

        กดดูสิคะ ˚₊‧

      </div>


    </section>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>


    /* =========================
       FIREWORK SYSTEM
    ========================= */

    const fireworks =
      document.getElementById(
        "fireworks"
      );


    const symbols = [

      "🐱",
      "♡",
      "✦",
      "˚₊‧",
      "✧"

    ];


    function createFirework() {


      const firework =
        document.createElement(
          "div"
        );


      firework.className =
        "firework";


      const startX =
        Math.random() * 90 + 5;


      const endX =
        (Math.random() - 0.5)
        * 180;


      const endY =
        -(Math.random() * 55 + 25);


      firework.style.left =
        startX + "%";


      firework.style.setProperty(
        "--x",
        "0px"
      );


      firework.style.setProperty(
        "--y",
        endY + "vh"
      );


      firework.style.animationDelay =
        "0s";


      const pieces =
        Math.floor(
          Math.random() * 3
        ) + 4;


      for (
        let i = 0;
        i < pieces;
        i++
      ) {


        const piece =
          document.createElement(
            "span"
          );


        piece.innerText =
          symbols[
            Math.floor(
              Math.random()
              * symbols.length
            )
          ];


        const angle =
          (
            Math.PI * 2
            / pieces
          ) * i;


        const distance =
          35 +
          Math.random() * 45;


        const x =
          Math.cos(angle)
          * distance;


        const y =
          Math.sin(angle)
          * distance;


        piece.style.left =
          x + "px";


        piece.style.top =
          y + "px";


        piece.style.opacity =
          0.75 +
          Math.random() * 0.25;


        firework.appendChild(
          piece
        );

      }


      fireworks.appendChild(
        firework
      );


      setTimeout(
        function() {

          firework.remove();

        },
        1300
      );

    }


    /* =========================
       START FIREWORKS
    ========================= */

    function startFireworks() {


      createFirework();


      setTimeout(
        createFirework,
        450
      );


      setTimeout(
        createFirework,
        900
      );


      setTimeout(
        createFirework,
        1400
      );


      setTimeout(
        createFirework,
        1900
      );


      setInterval(
        function() {

          createFirework();

        },
        2200
      );

    }


    /* =========================
       START PAGE
    ========================= */

    window.addEventListener(
      "load",
      function() {

        startFireworks();

      }
    );


    /* =========================
       GO TO LETTER
    ========================= */

    function goToLetter() {

      window.location.href =
        "./letter.html";

    }


  </script>


</body>

</html>
