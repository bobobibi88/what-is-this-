<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ความลับ ♡</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Mali:wght@300;400;500;600&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg: #FFF7F5;
      --card: #FFFCFA;
      --pink: #D99AA5;
      --rose: #8F5F68;
      --text: #594348;
      --blush: #F2D6D9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Mali', cursive;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;
    }

    .content {
      width: 100%;
      max-width: 500px;
      text-align: center;

      animation: fadeIn 1.2s ease;
    }

    /* ข้อความเล็กด้านบน */

    .small-text {
      margin-bottom: 20px;

      font-family: 'Quicksand', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;

      color: var(--pink);
    }

    /* หัวข้อ */

    h1 {
      margin: 0;

      font-family: 'Gowun Batang', serif;
      font-size: clamp(27px, 8vw, 40px);
      font-weight: 400;

      color: var(--rose);
      line-height: 1.6;
    }

    /* ข้อความ */

    .message {
      margin-top: 20px;

      font-size: 16px;
      line-height: 2;
    }

    /* ช่องใส่รหัส */

    .password-box {
      margin-top: 28px;
    }

    input {
      width: 220px;

      padding: 13px 18px;

      border: 1px solid var(--blush);
      border-radius: 999px;

      outline: none;

      background: var(--card);
      color: var(--rose);

      font-family: 'Quicksand', sans-serif;
      font-size: 18px;

      text-align: center;
      letter-spacing: 5px;

      transition: 0.3s ease;
    }

    input:focus {
      border-color: var(--pink);

      box-shadow:
        0 0 0 4px rgba(217, 154, 165, 0.12);
    }

    input::placeholder {
      letter-spacing: 2px;
      color: #C8AEB2;
    }

    /* ปุ่ม */

    .button {
      margin-top: 20px;

      padding: 12px 30px;

      border: 1px solid var(--pink);
      border-radius: 999px;

      background: var(--card);
      color: var(--rose);

      font-family: 'Mali', cursive;
      font-size: 15px;

      cursor: pointer;

      transition: all 0.3s ease;
    }

    .button:hover {
      background: var(--pink);
      color: white;
      transform: translateY(-3px);
    }

    /* ข้อความตอนใส่ผิด */

    #wrongMessage {
      display: none;

      margin-top: 25px;

      animation: popIn 0.4s ease;
    }

    .wrong-text {
      color: var(--rose);

      font-size: 16px;
      line-height: 1.8;
    }

    /* ปุ่มเลือก */

    .choice-buttons {
      display: flex;

      justify-content: center;

      gap: 10px;

      flex-wrap: wrap;

      margin-top: 15px;
    }

    .choice {
      padding: 10px 20px;

      border: 1px solid var(--blush);
      border-radius: 999px;

      background: var(--card);
      color: var(--rose);

      font-family: 'Mali', cursive;

      cursor: pointer;

      transition: 0.3s ease;
    }

    .choice:hover {
      background: var(--blush);

      transform: translateY(-2px);
    }

    /* คำใบ้ */

    #hint {
      display: none;

      margin-top: 18px;

      padding: 13px 20px;

      border-radius: 18px;

      background: rgba(242, 214, 217, 0.45);

      color: var(--text);

      font-size: 15px;

      line-height: 1.8;

      animation: popIn 0.4s ease;
    }

    /* ของตกแต่ง */

    .deco {
      position: absolute;

      color: var(--pink);

      opacity: 0.45;

      pointer-events: none;

      animation: float 4s ease-in-out infinite;
    }

    .one {
      top: 17%;
      left: 14%;
      font-size: 18px;
    }

    .two {
      top: 29%;
      right: 14%;
      font-size: 13px;

      animation-delay: 1s;
    }

    .three {
      bottom: 20%;
      left: 18%;

      animation-delay: 2s;
    }

    .four {
      bottom: 28%;
      right: 17%;
      font-size: 18px;

      animation-delay: 0.5s;
    }

    /* Animation */

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    @keyframes popIn {

      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <!-- ตกแต่ง -->

    <div class="deco one">♡</div>

    <div class="deco two">✦</div>

    <div class="deco three">˚₊‧</div>

    <div class="deco four">♡</div>


    <!-- เนื้อหา -->

    <section class="content">

      <div class="small-text">
        ONE LITTLE SECRET
      </div>


      <h1>
        ไหน ๆ ก็เข้ามาแล้ว...
      </h1>


      <div class="message">

        มีประตูอีกบานอยู่ตรงนี้<br>

        แต่ต้องรู้รหัสก่อนนะ ♡

      </div>


      <!-- ช่อง Password -->

      <div class="password-box">

        <input
          type="password"
          id="password"
          placeholder="ใส่รหัส"
          maxlength="6"
          inputmode="numeric"
        >

        <br>

        <button
          class="button"
          onclick="checkPassword()"
        >
          ลองเปิดดู ♡
        </button>

      </div>


      <!-- เมื่อใส่รหัสผิด -->

      <div id="wrongMessage">

        <div class="wrong-text">

          ม่ายช่าย ♡<br>

          เอาคำใบ้มั้ยคะ?

        </div>


        <div class="choice-buttons">

          <button
            class="choice"
            onclick="showHint()"
          >
            เอาคำใบ้ ♡
          </button>


          <button
            class="choice"
            onclick="tryAgain()"
          >
            จะลองด้วยตัวเอง
          </button>

        </div>


        <!-- คำใบ้ -->

        <div id="hint">

          คำใบ้ : วันนี้ ♡

        </div>

      </div>


    </section>

  </main>


  <script>

    function checkPassword() {

      const password =
        document.getElementById("password").value;

      const wrongMessage =
        document.getElementById("wrongMessage");


      /* รหัสที่ถูกต้อง */

      if (password === "260969") {

        window.location.href = "faceid.html";

      }

      else {

        wrongMessage.style.display = "block";

      }

    }


    /* แสดงคำใบ้ */

    function showHint() {

      document.getElementById("hint").style.display = "block";

    }


    /* ลองใหม่ */

    function tryAgain() {

      const input =
        document.getElementById("password");

      input.value = "";

      input.focus();

      document.getElementById("wrongMessage").style.display = "none";

      document.getElementById("hint").style.display = "none";

    }


    /* กด Enter เพื่อส่งรหัส */

    document
      .getElementById("password")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          checkPassword();

        }

      });

  </script>


</body>
</html>
